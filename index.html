h+='<button class="ghost" id="bk" style="width:100%;margin-top:8px">Back</button>';c.innerHTML=h;
B("sv",function(){SV.name=cl($("nm").value);saveSv();$("sv").textContent="Saved ✓"});
[].forEach.call(c.querySelectorAll("[data-bt]"),function(b){b.onclick=function(){BT=b.dataset.bt;boardPage(c)}});B("bk",function(){go("main")})}
function overL(c){var L=LEVELS[UI.lvl-1],w=g1.won(),st=g1.stars(),sd=g1.seeds(),a=Math.floor(g1.top()/8),nx=UI.lvl<LEVELS.length;
c.innerHTML='<div class="logo">'+(w?"🌸":"🥀")+'</div><div class="tag" style="margin:0">Level '+UI.lvl+' · '+L.n+'</div><div class="big" style="font-size:2.4rem">'+(w?"Level complete!":"Wilted at "+a+" cm")+'</div>'+(w?'<div class="big" style="font-size:2rem">'+"★".repeat(st)+"☆".repeat(3-st)+'</div>':'<div class="tag">Goal: '+L.tgt+' cm</div>')+(sd?'<div class="seed">+'+sd+' 🌰 seeds</div>':'')+'<div class="stack"><button id="go">'+(w&&nx?"Next level":"Retry")+'</button>'+(w&&nx?'<button class="ghost" id="rt2">Retry</button>':'')+'<button class="ghost" id="lv">All levels</button><button class="ghost" id="mn">Main menu</button></div>';
B("go",function(){start(false,w&&nx?UI.lvl+1:UI.lvl)});B("rt2",function(){start(false,UI.lvl)});B("lv",function(){go("levels")});B("mn",function(){go("main")})}
function over1(c){if(UI.lvl){overL(c);return}var a=Math.floor(g1.top()/8),sd=g1.seeds(),rk=g1.rk();
c.innerHTML='<div class="logo">'+(g1.nb()?"🏆":"🥀")+'</div><div class="tag" style="margin:0">'+(UI.daily?"Daily garden · ":"")+'You reached</div><div class="big">'+a+' cm</div><div class="tag">'+rank(a)+(g1.nb()?" · New best!":"")+'</div>'+(rk?'<div class="seed">🏅 #'+rk+' on the leaderboard</div> ':'')+(sd?'<div class="seed">+'+sd+' 🌰 seeds · '+SV.seeds+' total</div>':'')+'<div class="stack"><button id="go">'+(UI.daily?"Retry daily":"Grow again")+'</button><button class="ghost" id="gh">🏡 Greenhouse</button><button class="ghost" id="mn">Main menu</button></div>';
B("go",function(){start(UI.daily)});B("gh",function(){go("green")});B("mn",function(){go("main")})}
function over2(c){var a=Math.floor(g1.top()/8),b=Math.floor(g2.top()/8),w=a===b?0:a>b?1:2;
c.innerHTML='<div class="logo">🏆</div><div class="big" style="font-size:2.4rem">'+(w?"Player "+w+" wins!":"It’s a tie!")+'</div><div class="vs"><div'+(w===1?' class="w"':'')+'>Player 1<b>'+a+' cm</b></div><div'+(w===2?' class="w"':'')+'>Player 2<b>'+b+' cm</b></div></div><div class="stack"><button id="go">Race again</button><button class="ghost" id="mn">Main menu</button></div>';
B("go",function(){start(false)});B("mn",function(){go("main")})}
function start(daily,lvl){
au();blur();UI.daily=daily;UI.lvl=lvl||0;
var two=!!CFG.two&&!daily&&!lvl,seed=daily?dseed():Math.floor(Math.random()*1e9);
document.body.classList.toggle("two",two);
cur=two?[g1,g2]:[g1];
cur.forEach(function(gm,i){
gm.setCtl(two?(i?{l:["arrowleft"],r:["arrowright"],s:["arrowup"]}:{l:["a"],r:["d"],s:["w"]}):{l:["arrowleft","a"],r:["arrowright","d"],s:["arrowup"," ","w"]});
gm.start(two&&!CFG.same?seed+i*7919:seed,daily?"medium":CFG.mode,two?"P"+(i+1):"",{fl:SV.sel,up:!two&&!daily?SV.up:null,daily:daily,two:two,lvl:lvl||0,map:daily?"meadow":SV.map,hc:two&&CFG.hcap===i+1?1:0});
gm.setOpp(two?cur[1-i]:null)});
$("ov").classList.add("hide");AU.on=true}
function pause(){if(!cur.some(function(x){return x.on()}))return;cur.forEach(function(x){x.pause(true)});AU.on=false;UI.page="pause";render()}
function resume(){blur();cur.forEach(function(x){x.pause(false)});$("ov").classList.add("hide");AU.on=true}
function exitGame(){cur.forEach(function(x){x.abort()});AU.on=false;UI.page="main";render()}
function esc(){var hidden=$("ov").classList.contains("hide");
if(hidden)pause();else if(UI.page==="pause")resume();else if(["green","settings","levels","board"].indexOf(UI.page)>-1)go(UI.back||"main")}
addEventListener("keydown",function(e){
if(e.key==="Escape"){if(!e.repeat)esc();return}
if(e.target&&e.target.tagName==="INPUT")return;
if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key)>-1)e.preventDefault();
keys[e.key.toLowerCase()]=true;
if(e.key==="Enter"&&UI.page==="main"&&!$("ov").classList.contains("hide")&&document.activeElement===document.body)start(false)});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
addEventListener("blur",function(){keys={};pause()});
render();
})();
</script>
</body>
</html>
